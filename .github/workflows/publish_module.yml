name: publish sunbird-quml-player

on:
  push:
    tags:
      - '*'

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'                          # ← Don't pin patch version
          registry-url: 'https://registry.npmjs.org' # ← Add this

      - name: Restore node_modules cache
        uses: actions/cache@v4                        # ← Removed duplicate save step
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm i --legacy-peer-deps

      - name: Publish to NPM
        run: |
          npm run build-lib
          npm pack ./dist/quml-library
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm publish $(ls sunbird-quml-player-*.tgz) --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}